<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/app_logo_192.png" />
    <link rel="apple-touch-icon" href="/app_logo_192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- SEO Description (Fixes Lighthouse SEO Penalty) -->
    <meta name="description" content="BSU-Trace: Batangas State University Smart Campus Resource Management System" />
    
    <!-- Preload critical LCP assets (Fixes Largest Contentful Paint) -->
    <link rel="preload" as="image" href="/bsu-logo.png" />

    <script>
    // Immediately check localStorage or system preference and apply the class before rendering
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
    </script>
    <title>BSU-Trace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
